name: Runner policy
on:
  pull_request:
    paths: ['.github/workflows/**', 'scripts/ci/*runner*']
  push:
    branches: [main]
    paths: ['.github/workflows/**', 'scripts/ci/*runner*']
concurrency:
  group: runner-policy-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  runner-policy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, nodecodex-ci]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate self-hosted runner policy
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/runner-policy-$GITHUB_RUN_ID"
          "$RUNNER_TEMP/runner-policy-$GITHUB_RUN_ID/bin/python" -m pip install --disable-pip-version-check PyYAML==6.0.3
          "$RUNNER_TEMP/runner-policy-$GITHUB_RUN_ID/bin/python" scripts/ci/test_runner_policy.py
          "$RUNNER_TEMP/runner-policy-$GITHUB_RUN_ID/bin/python" scripts/ci/check-runner-policy.py
